syntax = "proto3";

package messages;

service MessagesService {
  rpc TransmitMessage (TransmitMessageRequest) returns (TransmitMessageResponse) {}
}

// Transmit message

message TransmitMessageRequest {
  int32 id = 1;
  string message = 2;
}

message TransmitMessageResponse {
  int32 status = 1;
  repeated string error = 2;
  int32 id = 3;
  string message = 4;
}